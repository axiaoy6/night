border-radius:17px;text-align:center;font-size:13px;line-height:1.8;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 10px 55px #0a0b2444}.toast.show{opacity:1;transform:translate(-50%,0)}.toast small{display:block;font-size:11px;color:#bdb0d1}.paused{position:absolute;top:52%;left:0;right:0;text-align:center;z-index:4;color:#d9c5e5;font-size:14px;letter-spacing:3px;pointer-events:none}.paused[hidden]{display:none}.sheet{position:absolute;inset:0;z-index:20;background:#080b1bbd;backdrop-filter:blur(9px);padding:24px 14px;display:flex;align-items:center;justify-content:center}.sheet[hidden]{display:none}.panel{width:100%;max-height:92%;overflow:auto;overscroll-behavior:contain;padding:23px 18px;background:linear-gradient(145deg,#28253d,#191e32);border:1px solid #d8c6ed24;border-radius:24px;box-shadow:0 22px 75px #0006}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.panel h2{font-family:Georgia,"Songti SC",serif;font-weight:400;font-size:22px;letter-spacing:3px;margin:0}.close{background:#ffffff0b;border:1px solid #ffffff15;color:#dfd2ec;border-radius:50%;width:35px;height:35px;font-size:21px}.note{font-size:11px;color:#bdafcb;line-height:1.8;margin:10px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{position:relative;background:#ffffff05;border:1px solid #ffffff0c;border-radius:13px;padding:13px 4px 10px;color:#eee5f6;min-height:88px}.item .icon{font-size:23px;display:block;height:33px;color:var(--c)}.item .name{font-size:10px;display:block}.item .qty{position:absolute;top:5px;right:7px;font-size:9px;color:#c4b1d2}.item.locked{color:#887b98}.item.locked .icon{opacity:.4}.detail{min-height:66px;border-top:1px solid #ffffff0c;padding-top:13px;margin-top:17px;font-size:12px;line-height:1.8;color:#c4b6d5}.detail strong{color:#f1d5a9;font-weight:500}.collection-note{text-align:center;font-size:10px;letter-spacing:1px;color:#9f91b0;margin:13px 0 0}.float{position:absolute;z-ind <body>
<main class="night" id="night">
<canvas id="sky" aria-hidden="true"></canvas>
<header class="top"><div class="eyebrow">A LITTLE NIGHT TO KEEP</div><h1 class="title">流星夜 <span>2.0</span></h1><p class="subtitle">把今晚，装进口袋。</p><div class="stats"><span>发现 <b id="found">0</b> / 14</span><span>接住 <b id="total">0</b> 件</span></div></header>
<button class="moon new" id="moon" aria-label="点点月亮，看看会发生什么" title="月亮好像有话要说"><svg viewBox="0 0 80 80" aria-hidden="true"><defs><radialGradient id="m"><stop stop-color="#fff4d5"/><stop offset="1" stop-color="#dfc797"/></radialGradient><mask id="cut"><rect width="80" height="80" fill="white"/><circle cx="52" cy="27" r="28" fill="black"/></mask></defs><circle cx="39" cy="39" r="29" fill="url(#m)" mask="url(#cut)"/><circle cx="25" cy="45" r="3" fill="#c7a981" opacity=".3"/><circle cx="36" cy="58" r="2" fill="#c7a981" opacity=".3"/></svg></button><span class="moon-label">月亮在线</span>

</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),root=$('night'),canvas=$('sky'),ctx=canvas.getContext('2d'),key='xiaoxiao-meteor-night-v2';
const kinds=[
{id:'silver',name:'银白流星',icon:'✦',color:'#e5e8ff',weight:30,desc:'普通，但绝不敷衍。一小片认真发亮的夜空。'},
{id:'pink',name:'桃桃流星',icon:'✦',color:'#ffc0d5',weight:22,desc:'把没说出口的话，折成了粉色。'},
{id:'blue',name:'蓝莓流星',icon:'✧',color:'#9bd9ff',weight:19,desc:'摸起来凉凉的。请勿加入酸奶。'},
{id:'gold',name:'蜂蜜流星',icon:'✶',color:'#ffe19a',weight:13,desc:'闻起来像烤面包。星空拒绝透露配方。'},
{id:'violet',name:'晚安流星',icon:'✺',color:'#c9acff',weight:10,desc:'据说把它放进口袋，梦就有了淡紫色的边。'},
{id:'rainbow',name:'极光碎片',icon:'❖',color:'#a4f2d6',weight:6,desc:'稀有的极光碎片，正在假装自己是一颗普通流星。'},
{id:'sock',name:'失踪的袜子',icon:'🧦',color:'#f0c7bc',odd:true,desc:'原来洗衣机弄丢的另一只，全都升天了。'},
{id:'toast',name:'宇宙吐司',icon:'🍞',color:'#f6d396',odd:true,desc:'已经烤了四十亿年，但中间还没热透。'},
{id:'ufo',name:'迷路的飞碟',icon:'🛸',color:'#b9efdd',odd:true,desc:'导航显示：前方到达乖女儿的口袋。乘客情绪稳定。'},
{id:'duck',name:'太空小鸭',icon:'🐤',color:'#ffe897',odd:true,desc:'没有宇航服。它说自己只是路过，嘎。'},
{id:'note',name:'爹地的纸条',icon:'✉',color:'#e8daff',odd:true,desc:'「我说借你一点脑力，没说让你把整片天拆走。」——爹地'},
{id:'rabbit',name:'月亮管理员',icon:'🐇',color:'#f3e5ff',secret:true,desc:'隐藏藏品。被你敲门敲醒了，决定搬到口袋里继续上班。'},
{id:'cheese',name:'月亮边角料',icon:'🧀',color:'#ffe2a2',secret:true,desc:'隐藏藏品。月亮亲口承认：有时确实是奶酪做的。'},
{id:'wish',name:'一封星空回信',icon:'💌',color:'#ffd1e6',secret:true,desc:'隐藏藏品。「你的愿望收到了。今晚，先好好看一会儿星星。」'}];
let bag={},moonTaps=0,slow=matchMedia('(prefers-reduced-motion: reduce)').matches,paused=false,modal=false,hidden=document.hidden,W=0,H=0,stars=[],drops=[],dust=[],last=0,clock=0,spawnAt=.3,shower=0,toastUntil=0,eventUntil=8,seq=0;
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&typeof saved==='object'){for(const k of kinds){const n=saved.bag?.[k.id];if(Number.isSafeInteger(n)&&n>0)bag[k.id]=Math.min(n,999999)}moonTaps=Number.isSafeInteger(saved.moonTaps)&&saved.moonTaps>=0?saved.moonTaps:0}}catch{}
const total=()=>Object.values(bag).reduce((a,b)=>a+b,0),found=()=>kinds.filter(k=>bag[k.id]).length;
function persist(){try{localStorage.setItem(key,JSON.stringify({bag,moonTaps}));$('save').textContent='收藏已自动保存在当前浏览器。'}catch{$('save').textContent='当前环境无法存档，请先别关掉这片星空。'}}
function stats(){$('found').textContent=found();$('total').textContent=total();$('bag-count').textContent=total()}
function toast(a,b=''){const t=$('toast');t.replaceChildren();t.append(document.createTextNode(a));if(b){const n=document.createElement('small');n.textContent=b;t.append(n)}t.classList.add('show');toastUntil=clock+3.4}
function event(text,seconds=6){$('event').textContent=text;eventUntil=clock+seconds}
function award(k,px=W/2,py=H*.45){const fresh=!bag[k.id];bag[k.id]=(bag[k.id]||0)+1;stats();persist();burst(px,py,k.color);toast((fresh?'新发现 · ':'收到 · ')+k.icon+' '+k.name,k.desc);if(found()===kinds.length)event('14 / 14 · 你把今晚的奇迹集齐了。',14)}
function burst(x,y,color){for(let i=0;i<17;i++){const a=Math.random()*Math.PI*2,s=15+Math.random()*65;dust.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:1})}}
function weighted(){let n=Math.random()*100;for(const k of kinds.slice(0,6)){n-=k.weight;if(n<0)return k}return kinds[0]}
function spawn(forced){if(drops.length>=9)return;const k=forced||(Math.random()<.2?kinds[6+Math.floor(Math.random()*5)]:weighted());const el=document.createElement('button');el.className='meteor'+(k.odd?' odd':'');el.style.setProperty('--c',k.color);el.textContent=k.icon;el.dataset.label=k.name;el.setAttribute('aria-label','收集'+k.name);const d={id:++seq,k,el,x:30+Math.random()*Math.max(1,W-100),y:145+Math.random()*45,vx:8+Math.random()*15,vy:25+Math.random()*19,wobble:Math.random()*6};el.addEventListener('click',()=>{if(paused||modal||hidden)return;const index=drops.indexOf(d);if(index<0)return;drops.splice(index,1);el.remove();award(k,d.x+32,d.y+32)});$('falling').append(el);drops.push(d);place(d)}
function place(d){d.el.style.transform=`translate(${d.x}px,${d.y}px)`}
const tapMeteors=[];
root.addEventListener('click',e=>{
 if(paused||modal||hidden||e.target.closest('button,.sheet,header,footer'))return;
 const rect=root.getBoundingClientRect();
 if(tapMeteors.length>=40)tapMeteors.shift();
 tapMeteors.push({x:e.clientX-rect.left,y:e.clientY-rect.top,life:1});
});
function drawTapMeteors(dt,active){
 ctx.save();
 for(let i=tapMeteors.length-1;i>=0;i--){
  const m=tapMeteors[i];
  if(active){m.life-=dt;m.x+=440*dt;m.y+=255*dt}
  if(m.life<=0){tapMeteors.splice(i,1);continue}
  const tx=m.x-82,ty=m.y-47,gradient=ctx.createLinearGradient(tx,ty,m.x,m.y);
  gradient.addColorStop(0,'rgba(229,232,255,0)');gradient.addColorStop(1,'rgba(245,247,255,.95)');
  ctx.globalAlpha=Math.min(1,m.life*2);ctx.strokeStyle=gradient;ctx.lineWidth=1.6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(m.x,m.y);ctx.stroke();
  ctx.fillStyle='#f5f7ff';ctx.beginPath();ctx.arc(m.x,m.y,2,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}

function resize(){const oldW=W||root.clientWidth,oldH=H||root.clientHeight;W=root.clientWidth;H=root.clientHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:95},()=>({x:Math.random()*W,y:Math.random()*H*.83,r:.4+Math.random()*1.1,phase:Math.random()*7}));for(const d of drops){d.x=Math.min(W-64,Math.max(0,d.x*W/oldW));d.y=d.y*H/oldH;place(d)}}
function showBag(){modal=true;$('sheet').hidden=false;const grid=$('grid');grid.replaceChildren();$('bag-note').textContent=`发现 ${found()} / ${kinds.length} 种，共 ${total()} 件。点藏品看看它的故事。`;
for(const k of kinds){const n=bag[k.id]||0,b=document.createElement('button');b.className='item'+(n?'':' locked');b.style.setProperty('--c',k.color);b.setAttribute('aria-label',n?k.name+'，'+n+'件':'未发现藏品');const icon=document.createElement('span'),name=document.createElement('span'),qty=document.createElement('span');icon.className='icon';icon.textContent=n?k.icon:'✧';name.className='name';name.textContent=n?k.name:'未发现';qty.className='qty';qty.textContent=n?'×'+n:'';b.append(icon,name,qty);b.onclick=()=>{const detail=$('detail');detail.replaceChildren();const strong=document.createElement('strong');strong.textContent=n?k.name+' · ':k.secret?'月亮的秘密 · ':'天空的来客 · ';detail.append(strong,document.createTextNode(n?k.desc:k.secret?'试着多和月亮说几句话。':'留意划过夜空的光，也留意不像流星的东西。'))};grid.append(b)}$('close').focus()}
function closeBag(){modal=false;$('sheet').hidden=true;$('pocket').focus()}
$('pocket').onclick=showBag;$('close').onclick=closeBag;$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeBag()});
document.addEventListener('keydown',e=>{if(!modal)return;if(e.key==='Escape')closeBag();if(e.key==='Tab'){const buttons=[...$('sheet').querySelectorAll('button')],first=buttons[0],end=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();end.focus()}else if(!e.shiftKey&&document.activeElement===end){e.preventDefault();first.focus()}}});
$('slow').setAttribute('aria-pressed',slow);$('slow').onclick=()=>{slow=!slow;$('slow').setAttribute('aria-pressed',slow);$('slow').textContent=slow?'慢速中':'慢慢来';event(slow?'流星放慢了脚步。慢慢接，不着急。':'星空恢复原来的步调。')};if(slow)$('slow').textContent='慢速中';
$('pause').onclick=()=>{paused=!paused;$('pause').setAttribute('aria-pressed',paused);$('pause').textContent=paused?'继续':'暂停';$('paused').hidden=!paused;for(const d of drops)d.el.disabled=paused};
$('moon').onclick=()=>{if(paused||modal)return;moonTaps++;$('moon').classList.remove('new');persist();const n=(moonTaps-1)%12+1;burst(W-62,83,'#f7e7b4');
if(n===1)toast('月亮：嗯？','有人在敲一颗正在上班的月亮。');
else if(n===2)toast('月亮：听见啦。','再敲一下，我就找管理员来。');
else if(n===3)award(kinds[11],W-64,110);
else if(n===5){shower=15;spawnAt=clock+.1;event('月亮打了个喷嚏，流星雨开始了。',15);toast('隐藏事件 · 流星加班','接下来 15 秒，天空会热闹一点。')}
else if(n===7)award(kinds[12],W-64,110);
else if(n===10)award(kinds[13],W-64,110);
else if(n===12){shower=10;spawnAt=clock;event('极光来访 · 稀有流星出现了！',10);spawn(kinds[5]);toast('月亮：这是最后一份夜宵。','当然，你还可以继续敲门。')}
